<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<meta name="description" content="MIRU ライトを自分の Cloudflare に立てる手順と、つまずいたときの直し方">
<title>MIRU ライト 導入ガイド</title>
<style>
/* MIRU ライトの導入ガイド（2026-10-23）。MIRU 本体と同じ白い Liquid Glass。スマホが先、広い画面では真ん中に寄せるだけ */
:root{
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:rgba(15,23,42,.08);
  --accent:#0a84ff; --accent2:#0a72e8; --ok:#30b45a; --warn:#ff9f0a; --bad:#ff3b30; --violet:#7a5cff;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.9); --glass-edge:rgba(255,255,255,.95);
  --glass-shadow:0 1px 1px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.07),0 20px 50px rgba(15,23,42,.05);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --r:16px; --r-lg:22px; --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior-y:contain}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:#f4f6fa;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(70px);
  background:radial-gradient(40vmax 40vmax at 8% 6%,#cfe3ff 0,transparent 60%),radial-gradient(36vmax 36vmax at 92% 18%,#e6ddff 0,transparent 60%),
    radial-gradient(34vmax 34vmax at 50% 108%,#d8f5ec 0,transparent 60%);
  animation:drift 22s var(--ease) infinite alternate}
@keyframes drift{to{transform:translate3d(4%,5%,0) scale(1.08)}}
button,input{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-edge);border-radius:var(--r);box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.95)}

/* ── 上の帯 ── */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 16px 8px;
  background:rgba(244,246,250,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 1px 0 rgba(15,23,42,.05);transition:box-shadow .3s}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.12em;font-size:15px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px;letter-spacing:0;
  background:linear-gradient(135deg,#3d9bff,#7a5cff);box-shadow:0 4px 12px rgba(10,114,232,.3)}
.logo span{font-weight:700;letter-spacing:.02em;color:var(--ink2);font-size:13px}
.grow{flex:1;min-width:0}
.ring{position:relative;width:42px;height:42px;border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;transition:transform .4s var(--spring)}
.ring:active{transform:scale(.9)}
.ring svg{width:42px;height:42px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:rgba(15,23,42,.08)}
.ring .fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .9s var(--spring)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink2)}

main{padding:4px 16px calc(var(--tab-h) + 36px + var(--safe-b));max-width:640px;margin:0 auto}
section{animation:rise .55s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
h1{font-size:24px;line-height:1.25;margin:6px 0 12px}
h2{font-size:16px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
h2 .cnt{font-size:12px;font-weight:700;color:var(--ink3);background:rgba(15,23,42,.05);border-radius:999px;padding:1px 8px}
h2 .cnt.full{color:#fff;background:var(--ok);animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(.6)}}
.muted{color:var(--ink2)} .small{font-size:13px}
.card{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* ── 状態（下に引くと確かめ直す）── */
.status{display:flex;align-items:center;gap:12px;padding:12px 14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink3);box-shadow:0 0 0 4px rgba(148,163,184,.18);transition:background .4s,box-shadow .4s}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(48,180,90,.18);animation:beat 2.4s ease-in-out infinite}
.dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(255,159,10,.2)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 4px rgba(255,59,48,.18)}
@keyframes beat{50%{box-shadow:0 0 0 8px rgba(48,180,90,0)}}
.status b{display:block;font-size:14px}
.status .small{display:block;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink2);
  transition:background .2s,transform .35s var(--spring)}
.icon-btn:hover{background:rgba(15,23,42,.06)} .icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

/* ── あなたの値 ── */
.field{position:relative;display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
input{width:100%;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.85);border-radius:12px;padding:11px 12px;outline:none;
  transition:border-color .2s,box-shadow .2s;font-size:16px}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.15)}
.hint{font-size:12px;color:var(--ink3)}
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:rgba(15,23,42,.05)}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;padding:8px 10px;white-space:nowrap;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;transition:color .3s}
.seg button.on{color:var(--ink)}
.seg i{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.1);transition:left .5s var(--spring),width .5s var(--spring)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}

/* 入力の候補 */
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;padding:6px;border-radius:14px;max-height:240px;overflow:auto;
  background:var(--glass-strong);transform-origin:top center;animation:drop .35s var(--spring)}
@keyframes drop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.ac button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac button.on,.ac button:hover{background:rgba(10,132,255,.1)}
.ac mark{background:transparent;color:var(--accent);font-weight:800}
.ac small{display:block;color:var(--ink3);font-size:11px}

/* ── 手順（右へスワイプで「できた」、左へで戻す・出なかった）── */
.steps{display:flex;flex-direction:column;gap:8px}
.sw{position:relative;border-radius:var(--r);animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms)}
.quiet .sw,.quiet h2 .cnt:not(.full){animation:none}
.sw .under{position:absolute;inset:0;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800;font-size:13px;color:#fff;opacity:0;transition:opacity .2s}
.sw .under.r{background:linear-gradient(90deg,var(--ok),#5fd07f)}
.sw .under.l{background:linear-gradient(270deg,#8a94a6,#b4bdcc);justify-content:flex-end}
.sw .under svg{width:22px;height:22px;transition:transform .3s var(--spring)}
.step{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;touch-action:pan-y;user-select:none;
  transition:transform .45s var(--spring),box-shadow .3s,background .3s}
.step.drag{transition:none}
.step:active{box-shadow:var(--glass-shadow),0 0 0 3px rgba(10,132,255,.12)}
.mark{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid rgba(15,23,42,.14);display:grid;place-items:center;background:rgba(255,255,255,.7);
  transition:background .35s,border-color .35s,transform .45s var(--spring);padding:0;cursor:pointer}
.mark svg{width:16px;height:16px}
.mark path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .45s var(--ease) .1s}
.step.done .mark{background:var(--ok);border-color:var(--ok);transform:scale(1.06)}
.step.done .mark path{stroke-dashoffset:0}
.step.skip .mark{background:#c4cbd6;border-color:#c4cbd6}
.step.skip .mark path{stroke-dashoffset:22}
.step.skip .mark::after{content:"";width:10px;height:2px;border-radius:1px;background:#fff}
.step .t{font-weight:700;font-size:15px;line-height:1.35}
.step .d{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.step.done .t,.step.skip .t{color:var(--ink2)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px;background:rgba(255,159,10,.14);color:#b86e00}
.tag.you{background:rgba(122,92,255,.12);color:#5a3fd6}
.tag.ai{background:rgba(10,132,255,.12);color:var(--accent2)}
.chev{width:18px;height:18px;color:var(--ink3);flex:none}
.step.next{box-shadow:var(--glass-shadow),0 0 0 2px rgba(10,132,255,.5)}
.step.pulse{animation:pulse 1s var(--ease) 2}
@keyframes pulse{50%{box-shadow:var(--glass-shadow),0 0 0 8px rgba(10,132,255,.18)}}
.swipe-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink3);margin:10px 0 0}
.swipe-hint svg{width:16px;height:16px;animation:nudge 2.4s var(--ease) infinite}
@keyframes nudge{30%{transform:translateX(6px)}60%{transform:none}}

/* ── 困ったとき・そのあと ── */
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--ink3);pointer-events:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;border:0;width:100%;text-align:left;
  transition:transform .4s var(--spring),box-shadow .25s;animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0) * 35ms)}
.item:active{transform:scale(.98)}
.item .ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:.02em;
  background:linear-gradient(135deg,var(--c1,#3d9bff),var(--c2,#7a5cff));box-shadow:0 4px 12px rgba(10,114,232,.22)}
.item .t{font-weight:700;font-size:14.5px;line-height:1.35}
.item .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
.item mark{background:rgba(10,132,255,.14);color:inherit;border-radius:4px;padding:0 1px}
.empty{padding:28px 10px;text-align:center;color:var(--ink3);font-size:14px;animation:rise .4s var(--spring) both}

/* ── コマンド ── */
.code{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 10px 12px;border-radius:12px;background:rgba(15,23,42,.045);border:1px solid rgba(15,23,42,.06)}
.code code{flex:1;min-width:0;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;padding-top:2px}
.code button{flex:none;border:0;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--accent2);background:#fff;cursor:pointer;
  box-shadow:0 1px 4px rgba(15,23,42,.1);transition:transform .35s var(--spring),background .25s,color .25s}
.code button:active{transform:scale(.9)}
.code button.did{background:var(--ok);color:#fff}
.ph{color:#b86e00;background:rgba(255,159,10,.12);border-radius:4px;padding:0 2px}
.box{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:14px}
.box.warn{background:rgba(255,159,10,.08);border-color:rgba(255,159,10,.25)}
.box.ok{background:rgba(48,180,90,.08);border-color:rgba(48,180,90,.25)}
.box b{display:block;margin-bottom:2px}
.lbl{font-size:12px;font-weight:800;color:var(--ink2);margin:2px 4px -6px;letter-spacing:.02em}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
ol.how li::marker{color:var(--ink3);font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;align-items:baseline}
.kv b{color:var(--ink2);font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:12px;
  padding:10px 14px;font-weight:700;cursor:pointer;transition:transform .35s var(--spring),background .25s,box-shadow .25s;font-size:14px;color:var(--ink)}
.btn:active{transform:scale(.95)}
.btn.primary{border:0;border-radius:999px;color:#fff;padding:12px 20px;background:linear-gradient(180deg,#3d9bff,#0a72e8);box-shadow:0 8px 22px rgba(10,114,232,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.ok{border:0;color:#fff;background:linear-gradient(180deg,#45c46c,#2a9f4f);box-shadow:0 8px 22px rgba(48,180,90,.28)}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* ── 下のタブ ── */
.tabs{position:fixed;left:50%;bottom:calc(12px + var(--safe-b));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;
  border-radius:999px;width:min(420px,calc(100% - 24px))}
.tabs .pill{position:absolute;top:6px;bottom:6px;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.1);transition:left .55s var(--spring),width .55s var(--spring)}
.tabs button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 6px;border:0;background:transparent;border-radius:999px;
  color:var(--ink2);font-size:11px;font-weight:700;cursor:pointer;transition:color .3s,transform .35s var(--spring)}
.tabs button svg{width:22px;height:22px;transition:transform .45s var(--spring)}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{transform:translateY(-1px) scale(1.08)}
.tabs button:active{transform:scale(.92)}

/* ── 下から出るパネル ── */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.22);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0 auto;max-width:640px;max-height:min(88vh,860px);display:flex;flex-direction:column;
  border-radius:24px 24px 0 0;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 -10px 40px rgba(15,23,42,.14),inset 0 1px 0 #fff;transform:translateY(105%);transition:transform .55s var(--spring)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{padding:10px 0 4px;cursor:grab;touch-action:none;flex:none}
.grab i{display:block;width:40px;height:5px;border-radius:3px;background:rgba(15,23,42,.18);margin:0 auto}
.sheet header{display:flex;align-items:flex-start;gap:10px;padding:2px 18px 10px;flex:none}
.sheet header h3{margin:0;font-size:18px;line-height:1.35;flex:1}
.sheet .body{padding:0 18px calc(22px + var(--safe-b));overflow:auto;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sheet .body > *{animation:rise .5s var(--spring) both}
.sheet .body > *:nth-child(2){animation-delay:.04s} .sheet .body > *:nth-child(3){animation-delay:.08s} .sheet .body > *:nth-child(4){animation-delay:.12s}
.sheet .body > *:nth-child(n+5){animation-delay:.16s}

/* ── 知らせ ── */
.toasts{position:fixed;left:50%;bottom:calc(var(--tab-h) + 28px + var(--safe-b));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;
  background:rgba(15,23,42,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(15,23,42,.25);
  animation:tin .5s var(--spring) both}
.toast.out{animation:tout .35s var(--ease) both}
.toast svg{width:18px;height:18px;flex:none}
.toast.ok svg{color:#7ee29b} .toast.err svg{color:#ff8a80}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.92)}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.96)}}

/* ── 引いて確かめ直す ── */
.ptr{position:fixed;left:50%;top:calc(6px + var(--safe-t));z-index:25;width:40px;height:40px;margin-left:-20px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass-strong);box-shadow:0 6px 20px rgba(15,23,42,.14);transform:translateY(-70px) scale(.6);opacity:0;pointer-events:none}
.ptr svg{width:22px;height:22px;color:var(--accent)}
.ptr.go{transition:transform .5s var(--spring),opacity .3s}
.ptr.run svg{animation:turn .8s linear infinite}

/* ── 全画面の読み込み中 ── */
.skel{position:fixed;inset:0;z-index:100;background:#f4f6fa;padding:calc(10px + var(--safe-t)) 16px 0;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.skel.gone{opacity:0;transform:scale(1.02);pointer-events:none}
.skel .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sk{border-radius:14px;background:linear-gradient(100deg,rgba(15,23,42,.06) 30%,rgba(255,255,255,.9) 50%,rgba(15,23,42,.06) 70%);background-size:300% 100%;animation:shine 1.3s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.skel .bar{position:fixed;left:50%;bottom:calc(12px + var(--safe-b));transform:translateX(-50%);width:min(420px,calc(100% - 24px));height:58px;border-radius:999px}

/* できたときの粒 */
.spark{position:fixed;z-index:70;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:fly .9s var(--ease) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d9bff"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs></svg>

<div class="skel" id="skel" aria-hidden="true"><div class="in">
  <div style="display:flex;align-items:center;gap:10px;padding:0 0 6px"><div class="sk" style="width:26px;height:26px;border-radius:8px"></div><div class="sk" style="width:150px;height:18px"></div><div style="flex:1"></div><div class="sk" style="width:42px;height:42px;border-radius:50%"></div></div>
  <div class="sk" style="height:64px"></div>
  <div class="sk" style="width:110px;height:16px;margin-top:12px"></div>
  <div class="sk" style="height:230px"></div>
  <div class="sk" style="width:90px;height:16px;margin-top:12px"></div>

<script>
(() => {
"use strict";
const LITE = "fuuuuuuma/ai-video-editing-lite";

const KEY = "miru-light-guide-v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

// ── 覚えておくもの（この端末だけ。読めなくても動く）──
const S = { os: /Windows/i.test(navigator.userAgent) ? "win" : "mac", ai: "claude", email: "", sub: "", steps: {}, hist: { email: [], sub: [] } };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

// ── あなたの値から作るもの ──
const ph = (s) => `<span class="ph">${esc(s)}</span>`;
const subName = () => S.sub.trim().toLowerCase();
const url = () => (subName() ? `https://miru.${subName()}.workers.dev` : "");
const urlOr = () => url() || "https://miru.あなたの名前.workers.dev";
const email = () => S.email.trim().toLowerCase() || "あなたのメール@gmail.com";
const W = () => S.os === "win";
const home = () => (W() ? "$HOME\\MIRU" : "~/MIRU");
const npx = () => (W() ? "npx.cmd" : "npx");
const askSetup = () => (S.ai === "claude" ? "/ai-video-editing-lite:miru-setup" : "$miru-setup");
const install = () => S.ai === "claude"
  ? `claude plugin marketplace add ${LITE}\nclaude plugin install ai-video-editing-lite@ai-video-editing-lite`
  : `codex plugin marketplace add ${LITE}\ncodex plugin add ai-video-editing-lite@ai-video-editing-lite`;
const pluginUpdate = () => S.ai === "claude"
  ? "claude plugin marketplace update ai-video-editing-lite && claude plugin update ai-video-editing-lite@ai-video-editing-lite"
  : "codex plugin marketplace upgrade ai-video-editing-lite && codex plugin add ai-video-editing-lite@ai-video-editing-lite";
const setupCmd = (sub) => `node ${home()}${W() ? "\\tools\\setup.mjs" : "/tools/setup.mjs"} ${sub}`;
const secretCmd = () => (W() ? `cd ${home()}\n${npx()} wrangler secret put GOOGLE_CLIENT_SECRET` : `cd ${home()} && ${npx()} wrangler secret put GOOGLE_CLIENT_SECRET`);

/** コマンドの箱（コピーできる）。text は素の文字。placeholder の印はあとで付ける */
let codes = [];
function code(text, mark = []) {
  codes.push(text);
  let html = esc(text);
  for (const m of mark) html = html.split(esc(m)).join(ph(m));
  return `<div class="code"><code>${html}</code><button data-copy="${codes.length - 1}">コピー</button></div>`;
}
const placeholders = () => [!S.email.trim() && "あなたのメール@gmail.com", !url() && "https://miru.あなたの名前.workers.dev"].filter(Boolean);

// ── 手順 ──（who: you あなたがする / ai AI がする。opt: 出たときだけ）

    ] },

    ] },

      steps(`${link("https://dash.cloudflare.com/?to=/:account/r2/overview", "Cloudflare のダッシュボードの R2")} を開く`, "案内に沿って有効にする（支払い方法の登録を求められることがあります）", "AI に「有効にした」と伝える（同じコマンドを続きから動かします）"),
      box("請求は？", "10GB までは無料です。MIRU ライトは 9GB で止まるので、請求は来ません。"),
    ] },
    { id: "subdomain", who: "you", opt: true, t: "workers.dev の名前を決める", d: "「名前がまだ決まっていません」と出たら", body: () => [
      steps(`AI が出したリンク（…/workers/onboarding）か、${link("https://dash.cloudflare.com/?to=/:account/workers/onboarding", "Workers の始め方の画面")} を開く`,
        "好きな英字の名前を登録する（例: taro-videos）", "上の「あなたの値」の workers.dev の名前に入れる", "AI に「登録した」と伝える"),
    ] },
    { id: "published", who: "ai", t: "公開できた URL を入れる", d: "「✓ MIRU を公開しました」と出たら", body: () => [
      box("", "AI がこう出します。この URL を上の「あなたの値」に入れると、このあとの手順があなたの値になります。"),
      code(`✓ MIRU を公開しました: ${urlOr()}`, placeholders()),
      box("", "まだログインはできません（「ログインはまだ用意されていません」と出ます）。次の Google の設定で使えるようになります。"),

  ] },
  { id: "google", title: "Google でログインできるようにする", steps: [
    { id: "project", who: "you", t: "プロジェクトを作る", d: "Google Cloud", body: () => [
      steps(`${link("https://console.cloud.google.com/projectcreate", "Google Cloud の新しいプロジェクト")} を開く`, "名前を <b>MIRU</b> にして「作成」", "上の「プロジェクトを選択」で MIRU が選ばれていることを確かめる"),
    ] },

    ] },

  { id: "subdomain", g: "cf", c: ["#3d9bff", "#0a72e8"], t: "workers.dev の名前がまだ決まっていません", k: "workers.dev subdomain onboarding サブドメイン 名前", body: () => [steps("出たリンク（…/workers/onboarding）で英字の名前を登録", "同じコマンドをもう一度")] },

  if (card) {

function burst(el, n = 10) {

  const cols = ["#30b45a", "#5fd07f", "#3d9bff", "#ffd60a"];
  for (let k = 0; k < n; k++) {
    const a = (Math.PI * 2 * k) / n + Math.random() * 0.4, d = 26 + Math.random() * 22;
    const sp = h(`<i class="spark"></i>`);
    sp.style.cssText = `left:${r.left + r.width / 2 - 4}px;top:${r.top + r.height / 2 - 4}px;background:${cols[k % cols.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    document.body.append(sp); setTimeout(() => sp.remove(), 1000);

}

// ── 右へ・左へスワイプ ──
function swipe(wrap, s) {
  const card = wrap.querySelector(".step"), ur = wrap.querySelector(".under.r"), ul = wrap.querySelector(".under.l");
  let x0 = 0, y0 = 0, dx = 0, on = false, locked = null;
  const TH = 84;
  card.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest(".mark")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; on = true; locked = null;
  });
  card.addEventListener("pointermove", (e) => {
    if (!on) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { locked = Math.abs(mx) > Math.abs(my) ? "x" : "y"; if (locked === "x") { card.setPointerCapture(e.pointerId); card.classList.add("drag"); } }
    if (locked !== "x") return;
    dx = mx > 0 ? Math.min(mx, 160) * (mx > TH ? 0.85 : 1) : Math.max(mx, -160) * (mx < -TH ? 0.85 : 1);
    card.style.transform = `translateX(${dx}px)`;
    ur.style.opacity = dx > 0 ? String(Math.min(1, dx / TH)) : "0";
    ul.style.opacity = dx < 0 ? String(Math.min(1, -dx / TH)) : "0";
    ur.querySelector("svg").style.transform = `scale(${dx > TH ? 1.25 : 0.8 + Math.max(0, dx) / TH * 0.2})`;
  });
  const end = () => {
    if (!on) return; on = false;
    card.classList.remove("drag");
    if (locked === "x") {
      if (dx > TH) setStep(s, "done", card);
      else if (dx < -TH) setStep(s, s.opt ? "skip" : "todo", card);
      card.dataset.swiped = "1"; setTimeout(() => delete card.dataset.swiped, 50);
    }
    card.style.transform = ""; ur.style.opacity = "0"; ul.style.opacity = "0";
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

function autocomplete(input, source, pick) {
  let list = null, items = [], at = -1;
  const close = () => { list?.remove(); list = null; at = -1; };
  const show = () => {
    items = source(input.value);
    close();
    if (!items.length) return;
    list = h(`<div class="ac glass" role="listbox"></div>`);
    items.forEach((it, i) => {
      const b = h(`<button type="button" role="option">${it.html}${it.note ? `<small>${esc(it.note)}</small>` : ""}</button>`);
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); choose(i); });
      list.append(b);
    });
    input.parentElement.append(list);
  };
  const mark = () => list?.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === at));
  const choose = (i) => { const it = items[i]; if (!it) return; pick ? pick(it) : (input.value = it.value, input.dispatchEvent(new Event("input"))); close(); };
  input.addEventListener("input", show);
  input.addEventListener("focus", show);
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", (e) => {
    if (!list) return;
    if (e.key === "ArrowDown") { at = (at + 1) % items.length; mark(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { at = (at - 1 + items.length) % items.length; mark(); e.preventDefault(); }
    else if (e.key === "Enter" && at >= 0) { choose(at); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
}
const hi = (s, q) => { const i = q ? s.toLowerCase().indexOf(q.toLowerCase()) : -1; return i < 0 ? esc(s) : esc(s.slice(0, i)) + `<mark>${esc(s.slice(i, i + q.length))}</mark>` + esc(s.slice(i + q.length)); };
const DOMAINS = ["gmail.com", "icloud.com", "outlook.jp", "outlook.com", "yahoo.co.jp", "googlemail.com"];
const emailIn = $("#email"), subIn = $("#sub");
emailIn.value = S.email; subIn.value = S.sub;
autocomplete(emailIn, (v) => {

  const hist = (S.hist.email || []).filter((x) => x !== q && x.startsWith(q.toLowerCase())).map((x) => ({ value: x, html: hi(x, q), note: "前に入れたもの" }));
  if (!q) return hist.slice(0, 4);
  const [name, dom = ""] = q.split("@");
  const sug = q.includes("@") || name ? DOMAINS.filter((d) => d.startsWith(dom) && `${name}@${d}` !== q).map((d) => ({ value: `${name}@${d}`, html: hi(`${name}@${d}`, q) })) : [];
  return [...hist, ...sug].slice(0, 6);

const toSub = (v) => {
  const s = v.trim().toLowerCase();
  const m = /^(?:https?:\/\/)?(?:[a-z0-9-]+\.)?([a-z0-9-]+)\.workers\.dev\/?/.exec(s);
  return m ? m[1] : s.replace(/^https?:\/\//, "").replace(/\.workers\.dev.*$/, "").replace(/[^a-z0-9-]/g, "");
};
autocomplete(subIn, (v) => {
  const q = v.trim().toLowerCase();
  const out = [];
  if (q && /workers\.dev|https?:/.test(q) && toSub(q)) out.push({ value: toSub(q), html: `<b>${esc(toSub(q))}</b>`, note: `https://miru.${toSub(q)}.workers.dev として使う` });
  for (const x of S.hist.sub || []) if (x !== q && x.startsWith(toSub(q))) out.push({ value: x, html: hi(x, toSub(q)), note: "前に入れたもの" });
  return out.slice(0, 5);
}, (it) => { subIn.value = it.value; subIn.dispatchEvent(new Event("input")); });
const remember = (k, v) => { if (!v) return; S.hist[k] = [v, ...(S.hist[k] || []).filter((x) => x !== v)].slice(0, 5); save(); };
let typing = 0;
emailIn.addEventListener("input", () => { S.email = emailIn.value; save(); clearTimeout(typing); typing = setTimeout(drawSteps, 250); });
emailIn.addEventListener("change", () => { const v = emailIn.value.trim().toLowerCase(); if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { remember("email", v); toast("メールを入れました", "ok"); } else if (v) toast("メールの形を確かめてください", "err"); });
subIn.addEventListener("input", () => { S.sub = toSub(subIn.value); save(); drawHint(); clearTimeout(typing); typing = setTimeout(() => { drawSteps(); }, 250); });
subIn.addEventListener("change", () => { subIn.value = S.sub; drawHint(); if (S.sub) { remember("sub", S.sub); refresh(true); } });
function drawHint() { $("#urlHint").textContent = url() ? `あなたの MIRU: ${url()}` : "入れると、Google に入れる URL とコマンドがあなたの値になります"; }

// ── あなたの MIRU を確かめる（下に引く・右上のボタン）──
let checking = false;
async function refresh(quiet = false) {
  if (checking) return;
  const dot = $("#dot"), t = $("#stTitle"), sub = $("#stSub"), btn = $("#refresh");
  if (!url()) { dot.className = "dot"; t.textContent = "あなたの MIRU"; sub.textContent = "URL を入れると、動いているか確かめます"; if (!quiet) toast("workers.dev の名前を入れると確かめられます"); return; }
  checking = true; btn.classList.add("spin");
  t.textContent = "確かめています…"; sub.textContent = url();
  const get = (u) => Promise.race([fetch(u, { cache: "no-store" }).then((r) => r.json()), new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 9000))]);
  try {
    const [hRes, fRes] = await Promise.allSettled([get(`${url()}/api/health`), get(FEED)]);
    const health = hRes.status === "fulfilled" ? hRes.value : null, feed = fRes.status === "fulfilled" ? fRes.value : null;
    if (!health) { dot.className = "dot bad"; t.textContent = "まだ見つかりません"; sub.textContent = `${url()} が開けません（まだ公開していないか、名前が違います）`; if (!quiet) toast("あなたの MIRU が見つかりません", "err"); return; }
    if (!health.ok) { dot.className = "dot warn"; t.textContent = "動いていますが、データベースに届きません"; sub.textContent = "AI に「MIRU を確かめて」と頼みます"; if (!quiet) toast("データベースに届きません", "err"); return; }
    const have = health.version?.build || 0, latest = feed?.build || 0;
    if (latest && have < latest) { dot.className = "dot warn"; t.textContent = `動いています・新しい版があります`; sub.textContent = `いま 版 ${have || "?"} → 新しい版 ${latest}（${feed.date}）。「そのあと」から`; if (!quiet) toast("新しい版があります"); }
    else { dot.className = "dot ok"; t.textContent = "動いています"; sub.textContent = `${health.edition === "light" ? "MIRU ライト" : "MIRU"}${have ? `・版 ${have}（${health.version.date}）` : ""}`; if (!quiet) toast("あなたの MIRU は動いています", "ok"); }
  } finally { checking = false; btn.classList.remove("spin"); }
}
$("#refresh").addEventListener("click", () => refresh());

// 下に引いて離すと確かめ直す
(() => {
  const ptr = $("#ptr");
  let y0 = null, d = 0;
  addEventListener("touchstart", (e) => { y0 = scrollY <= 0 && !sheet.classList.contains("on") ? e.touches[0].clientY : null; d = 0; ptr.classList.remove("go"); }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (y0 === null) return;
    d = Math.max(0, e.touches[0].clientY - y0);
    const p = Math.min(1, d / 90), pull = Math.min(110, d * 0.55);
    ptr.style.opacity = String(p);
    ptr.style.transform = `translateY(${pull - 60}px) scale(${0.6 + p * 0.4}) rotate(${d * 2.2}deg)`;
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 === null) return;
    y0 = null;
    ptr.classList.add("go");
    if (d > 90) {
      ptr.style.transform = "translateY(26px) scale(1)"; ptr.classList.add("run");
      await Promise.all([refresh(), new Promise((r) => setTimeout(r, 700))]);
      ptr.classList.remove("run");
    }
    ptr.style.opacity = "0"; ptr.style.transform = "translateY(-70px) scale(.6)";
  });
})();

// ── 困ったとき・そのあと ──
const GROUP = { cf: "CF", g: "G", miru: "M", pc: "PC", help: "?" };
function itemRow(x, i, hiq = "") {
  return h(`<button class="glass item" style="--i:${i};--c1:${x.c[0]};--c2:${x.c[1]}" data-item="${x.id}">
    <span class="ic">${x.ic ?? GROUP[x.g] ?? "?"}</span>
    <span class="grow"><span class="t" style="display:block">${hiq ? hi(x.t, hiq) : esc(x.t)}</span>${x.d ? `<span class="d" style="display:block">${esc(x.d)}</span>` : ""}</span>${CHEV}</button>`);
}
const norm = (s) => s.toLowerCase().normalize("NFKC");
const matches = (x, q) => { const n = norm(q).trim(); return !n || n.split(/\s+/).every((w) => norm(`${x.t} ${x.k}`).includes(w)); };
function drawTroubles(q = "") {
  const box = $("#troubles"); box.replaceChildren();
  const hits = TROUBLES.filter((x) => matches(x, q));
  hits.forEach((x, i) => box.append(itemRow(x, i, q.trim())));
  if (!hits.length) box.append(h(`<div class="empty">見つかりません。言葉を短くするか、「それでも直らない」から Issues へ</div>`));
}
function drawAfters() { const box = $("#afters"); box.replaceChildren(); AFTERS.forEach((x, i) => box.append(itemRow(x, i))); }
const qIn = $("#q");
autocomplete(qIn, (v) => TROUBLES.filter((x) => v.trim() && matches(x, v)).slice(0, 5).map((x) => ({ value: x.t, html: hi(x.t, v.trim()), id: x.id })),
  (it) => { qIn.value = it.value; drawTroubles(it.value); openItem(it.id); });
qIn.addEventListener("input", () => drawTroubles(qIn.value));
function openItem(id) { const x = TROUBLES.find((y) => y.id === id); if (x) openSheet(x.t, x.body()); }
document.addEventListener("click", (e) => {
  const mk = e.target.closest("[data-mark]");
  if (mk) { const s = ALL.find((x) => x.id === mk.dataset.mark); setStep(s, stateOf(s.id) === "done" ? "todo" : "done"); e.stopPropagation(); return; }
  const st = e.target.closest("[data-step]");
  if (st && !st.dataset.swiped) { openStep(st.dataset.step); return; }
  const it = e.target.closest("[data-item]");
  if (it) { const list = it.closest("#afters") ? AFTERS : TROUBLES; const x = list.find((y) => y.id === it.dataset.item); if (x) openSheet(x.t, x.body()); }
});
document.addEventListener("keydown", (e) => { const st = e.target.closest?.("[data-step]"); if (st && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openStep(st.dataset.step); } });

// ── 下のタブ ──
let tab = "steps";
function drawPill() { const b = $(`#tabs button[data-tab="${tab}"]`), p = $("#pill"); p.style.left = `${b.offsetLeft}px`; p.style.width = `${b.offsetWidth}px`; }
function go(t) {
  if (t === tab) { scrollTo({ top: 0, behavior: "smooth" }); return; }
  const run = () => {
    tab = t;
    document.querySelectorAll("section[data-tab]").forEach((s) => (s.hidden = s.dataset.tab !== t));
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
    drawPill(); scrollTo(0, 0);
  };
  document.startViewTransition && !matchMedia("(prefers-reduced-motion:reduce)").matches ? document.startViewTransition(run) : run();
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("#ring").addEventListener("click", () => {
  go("steps");
  const next = ALL.find((s) => stateOf(s.id) === "todo");
  if (!next) { toast("全部できています", "ok"); return; }
  setTimeout(() => { const el = document.querySelector(`[data-step="${next.id}"]`); el?.scrollIntoView({ behavior: "smooth", block: "center" }); el?.classList.add("pulse"); setTimeout(() => el?.classList.remove("pulse"), 2100); }, 80);
});
addEventListener("resize", () => { drawPill(); document.querySelectorAll(".seg").forEach(drawSeg); });

// ── はじめ ──
drawSteps(); drawTroubles(); drawAfters(); drawHint();
const ready = () => {
  document.querySelectorAll(".seg").forEach(drawSeg); drawPill();
  const sk = $("#skel"); sk.classList.add("gone"); setTimeout(() => sk.remove(), 650);
  if (url()) refresh(true);
};
const t0 = performance.now();
const fontsReady = document.fonts?.ready ?? Promise.resolve();
Promise.all([fontsReady, new Promise((r) => (document.readyState === "complete" ? r() : addEventListener("load", r, { once: true })))])
  .then(() => setTimeout(ready, Math.max(0, 450 - (performance.now() - t0))));
})();
</script>
</body>
</html>
