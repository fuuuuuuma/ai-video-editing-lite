# 検査（Mac・Windows・Linux）。MIRU ライトを立てる道具はにせの wrangler で通す（本物の Cloudflare には触れない）
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  miru-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test plugins/ai-video-editing-lite/miru/tools/setup.test.mjs
  miru-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ai-video-editing-lite/miru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
  skill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/ai-video-editing-lite/skills/ai-video-editing-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # setup.py と同じ形: venv を作り、Windows では UTF-8 で動かす設定（aive_utf8.pth）を置いてから、その python で試す
      - name: venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ -x "$RUNNER_TEMP/v/Scripts/python.exe" ]; then PY="$RUNNER_TEMP/v/Scripts/python.exe"; else PY="$RUNNER_TEMP/v/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -c "import site, pathlib, sys; sys.path.insert(0, 'scripts'); import setup; setup.put_utf8(pathlib.Path(site.getsitepackages()[-1]))"
          "$PY" -m pip install -q numpy pillow opencv-python-headless uharfbuzz fonttools
      - name: unittest
        shell: bash
        run: '"$PY" -m unittest discover -s tests'
